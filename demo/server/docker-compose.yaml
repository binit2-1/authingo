services:
  postgres:
    image: postgres:17-alpine
    container_name: authingo-demo-postgres
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-authingo_demo}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-authingo_demo_password}"
      POSTGRES_DB: "${POSTGRES_DB:-authingo_demo}"
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - demo_postgres_data:/var/lib/postgresql/data
      - ../../adapters/postgres/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  demo_postgres_data:
